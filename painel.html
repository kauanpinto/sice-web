<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SICE - Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="painel">
    <header class="navbar">
      <a class="logo" href="./painel.html">SICE</a>
      <div class="nav-btns">
        <button class="btn btn-ghost" data-role="push-btn">
          Ativar alertas
        </button>
        <button class="btn btn-ghost" data-role="logout-btn">Sair</button>
      </div>
    </header>
    <main hidden data-role="main">
      <div data-role="alerts-list"></div>
      <p role="status" data-role="push-status"></p>
      <section class="status-grid">
        <section class="card" data-block="equipment" data-state="off">
          <h2>Equipamento</h2>
          <span class="offline-badge" data-role="offline-badge" hidden></span>
          <span class="value" data-role="value">--</span>
          <span data-role="power">-- W</span>
        </section>
        <section class="card" data-block="presence" data-state="off">
          <h2>Presença</h2>
          <span class="value" data-role="value">--</span>
        </section>
        <section class="card" data-block="ambient" data-state="off">
          <h2>Ambiente</h2>
          <span class="value" data-role="value">--</span>
        </section>
        <section class="card" data-block="command" data-state="off">
          <h2>Comando</h2>
          <button
            role="switch"
            aria-checked="false"
            class="switch"
            data-role="switch"
          >
            Ligar
          </button>
          <span data-role="command-status">Comando: desligado</span>
        </section>
      </section>

      <section class="card">
        <h2>Energia</h2>
        <div class="chart" data-role="energy-chart"></div>
        <span data-role="energy-total">-- kWh hoje</span>
      </section>

      <section class="card">
        <h2>Custo do mês</h2>
        <span class="value" data-role="cost-value">R$ --</span>
        <span data-role="cost-detail">-- kWh • projeção R$ --</span>
      </section>

      <section class="card">
        <h2>Configuração</h2>
        <form data-role="settings-form">
          <fieldset>
            <legend>Equipamento</legend>
            <label>Nome<input name="name" required /></label>
            <label
              >Fuso horário<input
                name="timezone"
                value="America/Bahia"
                required
            /></label>
            <label
              >Tensão (V)<input name="voltageV" type="number" step="1" required
            /></label>
            <label
              >Corrente p/ considerar ligado (A)<input
                name="onCurrentA"
                type="number"
                step="0.01"
                required
            /></label>
          </fieldset>
          <fieldset>
            <legend>Funcionamento</legend>
            <label class="check-row"
              ><input type="radio" name="scheduleMode" value="always" />
              24h</label
            >
            <label class="check-row"
              ><input type="radio" name="scheduleMode" value="window" checked />
              Janela</label
            >
            <div data-role="window-fields">
              <label>Início<input name="scheduleStart" type="time" /></label>
              <label>Fim<input name="scheduleEnd" type="time" /></label>
            </div>
            <span class="error" data-error-for="schedule"></span>
          </fieldset>
          <fieldset>
            <legend>Limiares</legend>
            <label
              >Limiar de luz<input name="lightThreshold" type="number" required
            /></label>
            <label
              >Escuro quando<select name="darkWhen">
                <option value="high">Luz alta = escuro</option>
                <option value="low">Luz baixa = escuro</option>
              </select></label
            >
            <label
              >Carência (min)<input name="graceMinutes" type="number" required
            /></label>
            <label
              >Lembrete (min)<input
                name="reminderMinutes"
                type="number"
                required
            /></label>
            <label
              >Consumo alto (kWh/dia)<input
                name="highUsageKwhDay"
                type="number"
                step="0.1"
                required
            /></label>
          </fieldset>
          <fieldset>
            <legend>Alertas</legend>
            <label class="check-row"
              ><input type="checkbox" name="alertAbsence" /> Ausência</label
            >
            <label class="check-row"
              ><input type="checkbox" name="alertDark" /> Escuridão</label
            >
            <label class="check-row"
              ><input type="checkbox" name="alertOutsideSchedule" /> Fora do
              horário</label
            >
            <label class="check-row"
              ><input type="checkbox" name="alertHighUsage" /> Alto
              consumo</label
            >
          </fieldset>
          <button class="btn" type="submit" data-role="settings-btn">
            Salvar
          </button>
          <p role="alert" class="error" data-role="settings-error"></p>
          <p role="status" data-role="settings-success"></p>
        </form>
      </section>
    </main>
    <script type="module" src="./js/pages/painel.page.js"></script>
  </body>
</html>
