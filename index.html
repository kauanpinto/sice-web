<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SICE - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="login">
    <main class="login-container">
      <h1>SICE</h1>
      <section class="card login-card">
        <h2>Entrar</h2>
        <form id="login-form">
          <label
            >E-mail<input
              type="email"
              name="email"
              autocomplete="email"
              required
          /></label>
          <label
            >Senha<input
              type="password"
              name="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="btn" type="submit" data-role="login-btn">
            Entrar
          </button>
          <p role="alert" class="error" data-role="login-error" hidden></p>
        </form>
      </section>
    </main>
    <script type="module" src="./js/pages/login.page.js"></script>
  </body>
</html>
